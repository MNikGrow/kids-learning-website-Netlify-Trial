<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KidBodhi — Science & Brain Games for Kids (Class 1–6)</title>
<meta property="og:title" content="KidBodhi — Science & Brain Games for Kids">
<meta property="og:description" content="Free, ad-free science games and brain training for Class 1–6 in English, Hindi and Marathi. CBSE / NCERT aligned.">
<meta property="og:type" content="website"><meta property="og:image" content="icon-512.png">
<meta name="description" content="Free, ad-free science games and Brain Gym for kids in English, Hindi and Marathi. CBSE / NCERT aligned, Class 1 to 6. Certificates, worksheets and homework links for parents and teachers.">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#684bff"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#173b60;--accent:#31ad62;--accent2:#9ee85c;--bg:#efffe9;--lessonA:#dff5d0;--lessonB:#fff0c4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Trebuchet MS","Comic Sans MS",Arial,sans-serif;color:var(--ink);background:#12314f}
button{font:inherit;cursor:pointer}
:focus-visible{outline:4px solid #55c7ff;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== GAME ===== */
#game{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden;background:#12314f}
#gameBg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(6px) saturate(1.1);transform:scale(1.05)}
#gameBg:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#12314fb0,#12314f60)}
.top{position:relative;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap}
.tbtn,.xp,.timer{border:0;border-radius:14px;padding:10px 14px;background:#fff;color:#294d69;font-weight:900;box-shadow:0 6px 14px #173b6030}
.tbtn:hover{transform:translateY(-2px)}
.listen{background:#eaf6ff;color:#126da9}
.topTitle{flex:1;min-width:120px;color:#fff;font-size:clamp(17px,2.2vw,26px);font-weight:900;text-shadow:0 2px 6px #0007}
.timer{min-width:84px;text-align:center;color:#218d53}.timer.danger{background:#fff0f0;color:#d74c4c;animation:pulse .6s infinite alternate}
.xp{background:#fff2c9;color:#9a6800}
@keyframes pulse{to{transform:scale(1.07)}}
.main{position:relative;z-index:10;flex:1;min-height:0;display:grid;grid-template-columns:45fr 55fr;padding:0 2.4% 2.4%}
.visual{position:relative;border:5px solid #fffffff0;border-right:0;border-radius:32px 0 0 32px;overflow:hidden;background:var(--lessonA);box-shadow:0 20px 50px #0004;min-height:0}
.visual svg,.visual img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ribbon{position:absolute;left:14px;top:14px;z-index:3;background:var(--accent);color:#fff;padding:8px 14px;border-radius:14px;font-weight:900;box-shadow:0 6px 14px #0003}
.look{position:absolute;z-index:3;left:50%;bottom:14px;transform:translateX(-50%);background:#ffffffee;border-radius:99px;padding:8px 16px;font-weight:900;font-size:15px;white-space:nowrap;box-shadow:0 6px 14px #0003}
.bubble{position:absolute;z-index:4;right:12px;top:12px;max-width:62%;background:#fffbe0;border:3px solid #ffd550;border-radius:18px;padding:10px 12px;font-weight:800;font-size:15px;box-shadow:0 8px 18px #0003;display:none;animation:pop .35s}
.bubble.show{display:block}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.panel{position:relative;border:4px solid #fffffff2;border-left:0;border-radius:0 32px 32px 0;background:linear-gradient(145deg,var(--lessonA),var(--lessonB));padding:20px 28px 16px;display:flex;flex-direction:column;overflow:auto;box-shadow:0 20px 50px #0004;min-height:0}
.panel:before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:linear-gradient(90deg,var(--accent),var(--accent2),#55c7ff,#9b78ff,#ff8a54)}
.row{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
.badge{padding:7px 12px;border-radius:12px;background:#ffffffc8;color:var(--accent);font-weight:900;font-size:13px}.count{color:#4e687d}
.steps{display:flex;justify-content:center;gap:8px;margin:10px 0 4px}
.step{width:12px;height:12px;border-radius:50%;background:#ffffffa0}.step.done{background:var(--accent)}.step.on{width:36px;border-radius:10px;background:var(--accent)}
.tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.tool{border:0;border-radius:13px;padding:9px 13px;background:#ffffffd0;color:#0f6da8;font-weight:900}.tool.alt{color:#6449cf}
.question{font-size:clamp(21px,2.3vw,32px);line-height:1.2;font-weight:900;text-align:center;margin:8px 0 14px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ans{min-height:70px;border:3px solid #ffffffd0;border-radius:18px;background:#ffffffc8;display:flex;align-items:center;gap:10px;padding:9px 11px;text-align:left;font-size:clamp(16px,1.5vw,20px);font-weight:900;color:var(--ink);box-shadow:0 6px 14px #173b6014;transition:.15s;width:100%}
.ans:hover{transform:translateY(-3px);border-color:var(--accent);background:#fff}
.ans.correct{background:#e8faee;border-color:#2caf63;color:#176e3a;animation:pop .4s}
.ans.wrong{background:#fff0f0;border-color:#e55e5e;color:#a32e2e;animation:shake .4s}
.ans.disabled{pointer-events:none}.ans.disabled:not(.correct){opacity:.65}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.letter{width:38px;height:38px;border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--accent);flex:none;box-shadow:0 3px 8px #173b6020}
.aIcon{font-size:28px;flex:none}.ansText{flex:1}
.speak{width:36px;height:36px;border:0;border-radius:10px;background:#fff;flex:none;box-shadow:0 3px 8px #173b6016}
.hintRow{text-align:center;margin-top:10px}
.hintBtn{border:0;border-radius:13px;padding:9px 16px;background:#fff2c9;color:#9a6800;font-weight:900}
.clue{display:none;margin:8px auto 0;max-width:96%;padding:11px 14px;border-radius:16px;background:#fff8d6;font-weight:800;text-align:center;color:#36556d;animation:pop .3s}.clue.show{display:block}
.feedback{min-height:28px;margin-top:10px;text-align:center;font-weight:900;color:#5c7286}
.bottom{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.exit,.next,.big{border:0;border-radius:15px;padding:12px 18px;font-weight:900}
.exit{background:#ffffffc8;color:#345069}
.next{display:none;background:var(--accent);color:#fff;font-size:17px;animation:pop .35s}.next.show{display:block}
.overlay{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:#173b60b8;padding:14px;overflow:auto}
.finish{width:min(560px,94vw);background:#fff;border-radius:30px;padding:26px;text-align:center;box-shadow:0 30px 90px #0006;animation:pop .4s}
.finish h2{font-size:32px;margin:6px 0}.finish p{font-size:18px;font-weight:700;color:#5b7289;margin:6px 0}
.stars{font-size:54px;letter-spacing:6px}
.big{background:var(--accent);color:#fff;font-size:17px;margin:5px}
.fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.fx span{position:absolute;top:-40px;font-size:28px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

@media(max-width:820px){
 #game{overflow-y:auto}
 .main{display:block;padding:0 3% 18px}
 .visual{height:auto;aspect-ratio:4/3;border-right:5px solid #fffffff0;border-radius:28px 28px 0 0}
 .panel{border-left:4px solid #fffffff2;border-radius:0 0 28px 28px;padding:16px 16px 14px;overflow:visible}
 .answers{grid-template-columns:1fr}.look{display:none}
 .top{padding:8px 10px;gap:6px}.tbtn,.xp,.timer{padding:8px 10px;font-size:13px}.topTitle{order:-1;flex:1 0 100%}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== KidBodhi v5 : games-first layout ===== */
.needvoice{display:none!important}body.vp .needvoice{display:inline-block!important}body.vp .tools.needvoice{display:flex!important}
#hint{z-index:90;top:12%}
.k-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.k-barR{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.k-pill{background:#fff;color:#294d69;border:0;border-radius:99px;padding:8px 14px;font-weight:900;box-shadow:0 5px 12px #173b6030;white-space:nowrap}
.k-btn{cursor:pointer}.k-btn:hover{transform:translateY(-2px)}
.langBox{display:inline-flex;gap:4px;background:#ffffffd8;border-radius:99px;padding:3px;box-shadow:0 4px 10px #173b6026}
.lc{border:0;border-radius:99px;padding:6px 12px;background:transparent;color:#294d69;font-weight:900;font-size:14px;position:relative}.lc.on{background:#684bff;color:#fff}
.lc.soon{opacity:.55;cursor:pointer}.lc.soon .soonTag{position:absolute;top:-9px;right:-2px;background:#f2a11f;color:#fff;font-size:8px;font-weight:900;border-radius:7px;padding:1px 4px;line-height:1.3;box-shadow:0 2px 4px #0003}
/* HOME */
#home{position:fixed;inset:0;overflow:auto;display:none;flex-direction:column;background:#7ed6f5}
#bgimg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(4px) saturate(1.2) brightness(1.02);transform:scale(1.04);z-index:0}
.hShade{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,#ffffff38,#fff0 30%,#0000001a)}
#home>header,#home>main,#home>footer{position:relative;z-index:1}
.hbar{padding:10px clamp(10px,2vw,26px)}
.brand{background:#fff;border-radius:18px;padding:6px 18px;box-shadow:0 6px 16px #173b6030;line-height:1.1}
.bn{font-size:clamp(22px,2.6vw,32px);font-weight:900;color:#684bff;display:block}.bn span{color:#ff8a32}
.brand small{font-weight:800;font-size:12px;color:#60758c}
.hMain{flex:1;display:grid;grid-template-columns:1fr minmax(0,760px) 1fr;align-items:center;gap:clamp(12px,2.2vw,36px);padding:4px clamp(10px,2vw,28px)}
.side{display:flex;flex-direction:column;gap:clamp(12px,2.4vh,22px);width:clamp(150px,15vw,220px)}
#sideL{justify-self:end}#sideR{justify-self:start}
.k-cb{border:0;border-radius:24px;padding:10px 8px;color:#fff;background:linear-gradient(150deg,var(--c1),var(--c2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:clamp(100px,17vh,150px);box-shadow:0 10px 22px #173b6040,inset 0 0 0 3px #ffffff90;animation:flt 3.6s ease-in-out infinite;animation-delay:var(--d);transition:.2s}
.k-cb:hover{transform:scale(1.07);animation-play-state:paused}
.k-cb .e{font-size:clamp(34px,6vh,54px);line-height:1.05;filter:drop-shadow(0 3px 3px #0003)}.k-cb b{font-size:clamp(18px,2.6vh,25px);text-shadow:0 2px 4px #0003}.k-cb small{font-weight:800;opacity:.95}
.k-cb .st{background:#fff;color:#9a6800;border-radius:99px;padding:2px 10px;font-weight:900;font-size:13px;margin-top:2px}
@keyframes flt{50%{transform:translateY(-6px)}}
.stageC{position:relative;width:100%;height:min(calc(100dvh - 176px),720px);min-height:430px;border-radius:32px;overflow:hidden;border:6px solid #fff;box-shadow:0 22px 50px #0004;background:#bfeaff}
#cStart,#cEnd{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.2vh,12px);padding:14px;text-align:center;background:linear-gradient(#bfeaff,#e9ffd8 62%,#86d672)}
#cStart h1{margin:0;font-size:clamp(26px,4.6vh,44px);color:#173b60}
#cStart .sub{margin:0;font-weight:800;font-size:clamp(14px,2.2vh,19px);color:#36556d}
.prev{width:clamp(90px,17vh,140px);animation:flt 2.6s ease-in-out infinite}.prev svg,.skin svg{display:block;width:100%;height:auto}
.pick{font-weight:900;color:#4a35b0;font-size:15px}
.skins{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.skin{width:clamp(50px,8vh,66px);border:3px solid transparent;background:#ffffffb0;border-radius:16px;padding:4px}.skin.on{border-color:#31ad62;background:#fff;transform:scale(1.14)}
.how{margin:0;font-weight:800;font-size:clamp(13px,2vh,17px);color:#36556d;max-width:92%}.how.pts{color:#9a6800}
.playBtn{border:0;border-radius:99px;padding:clamp(12px,2vh,18px) clamp(34px,6vw,60px);font-size:clamp(22px,3.6vh,32px);font-weight:900;color:#fff;background:linear-gradient(135deg,#2fbf6b,#12a150);box-shadow:0 10px 24px #12a15066;animation:pulseb 1.8s ease-in-out infinite}
@keyframes pulseb{50%{transform:scale(1.07)}}
.best{font-weight:900;color:#9a6800;min-height:22px}
#cGame{position:absolute;inset:0}
.cHud{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;justify-content:space-evenly;gap:6px;padding:0 8px;background:#ffffffd8;z-index:5}
.hp{background:#fff;border:0;border-radius:99px;padding:6px 14px;font-weight:900;font-size:clamp(15px,2.2vh,20px);color:#294d69;box-shadow:0 3px 8px #173b6026}.hbtn{background:#fff2c9;color:#9a6800;cursor:pointer}
#cField,.field{touch-action:none;user-select:none;-webkit-user-select:none}
#cField{position:absolute;left:0;right:0;top:56px;bottom:0;overflow:hidden;background:linear-gradient(#9fdcff 0%,#e3f6ff 58%,#bff0a2 58%,#7ed06a 100%)}
#cField:before{content:"☁️";position:absolute;left:8%;top:6%;font-size:60px;opacity:.9;animation:drift 18s linear infinite}
#cField:after{content:"☁️";position:absolute;right:6%;top:16%;font-size:48px;opacity:.8;animation:drift 24s linear infinite reverse}
@keyframes drift{50%{transform:translateX(30px)}}
#cCount,#cBanner{position:absolute;left:0;right:0;text-align:center;pointer-events:none;z-index:4}
#cCount{top:24%;font-size:clamp(70px,16vh,130px);font-weight:900;color:#fff;text-shadow:0 5px 0 #12a150,0 0 18px #0006}
#cBanner{top:10%;display:none;font-size:clamp(20px,3.6vh,32px);font-weight:900;color:#9a6800}
#cBanner{margin:0 auto;width:max-content;max-width:90%;background:#fff2c9;border-radius:99px;padding:8px 22px;box-shadow:0 6px 16px #0003}
.pp{animation:ppx .6s}@keyframes ppx{0%{opacity:0;scale:.4}60%{scale:1.15}100%{opacity:1;scale:1}}
#cPaused{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:#173b60b0}
.it{position:absolute;left:0;top:0;line-height:1;pointer-events:none;will-change:transform;filter:drop-shadow(0 5px 4px #0003)}.it.gold{filter:drop-shadow(0 0 12px gold)}
.bk{position:absolute;left:0;bottom:6px;pointer-events:none;will-change:transform;z-index:3}.bk svg{display:block;width:100%;height:auto;transform-origin:50% 100%}.bk.sq svg{animation:sqz .25s}
@keyframes sqz{40%{transform:scale(1.13,.85)}}
.bs{position:absolute;font-size:24px;pointer-events:none;z-index:6;animation:bsx .7s forwards}@keyframes bsx{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.ft{position:absolute;z-index:6;font-weight:900;font-size:28px;color:#fff;text-shadow:0 2px 0 #1b7a3d,0 0 6px #000a;pointer-events:none;translate:-50% 0;animation:fty .9s forwards}@keyframes fty{to{transform:translateY(-64px);opacity:0}}
.ft.gold{color:#ffd700;font-size:36px}.ft.treat{color:#ffe0b2}
#cEnd .stars,.finish .stars{font-size:clamp(40px,8vh,64px);letter-spacing:6px}
#cEnd h2{margin:0;font-size:clamp(24px,4vh,38px);color:#173b60}.big2{font-size:clamp(18px,2.8vh,24px);font-weight:800;margin:0;color:#36556d}#cEnd p{margin:0;font-weight:800;color:#9a6800}
.k-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hFoot{text-align:center;font-weight:900;color:#fff;text-shadow:0 2px 4px #0008;padding:6px 10px 10px;font-size:14px}
/* HUB */
#hub{position:fixed;inset:0;display:none;overflow:auto;padding:14px 18px 40px;background:linear-gradient(160deg,var(--h1,#d9f7c6),var(--h2,#fff0c4))}
.hubIn{max-width:1260px;margin:0 auto;text-align:center}
.hubTop{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.hubTabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.hubTabs button{border:0;border-radius:99px;padding:9px 15px;background:#ffffffc0;font-weight:900;color:#294d69}.hubTabs button.on{background:#684bff;color:#fff}
#hub h1{margin:14px 0 2px;font-size:clamp(26px,4.4vw,44px);color:#173b60}.hubAge{margin:0 0 10px;font-weight:800;color:#4e687d}
.hubAct{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0 6px}.hubAct button{border:0;border-radius:14px;padding:10px 16px;background:#fff;font-weight:900;font-size:16px;color:#4a35b0;box-shadow:0 4px 10px #173b6020}
h2.sec{margin:20px 0 10px;font-size:clamp(20px,2.8vw,28px);color:#173b60}
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
.gc{width:220px;border:0;border-radius:28px;padding:26px 12px 18px;min-height:250px;color:#fff;background:linear-gradient(150deg,var(--c),var(--c2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 10px 24px #173b6030;transition:.2s}
.gc:hover{transform:translateY(-6px) scale(1.03)}.gce{font-size:86px;line-height:1.1;filter:drop-shadow(0 4px 6px #0003)}.gc b{font-size:21px;text-shadow:0 2px 4px #0003}.gc small{font-size:14px;font-weight:800}.gcs{margin-top:6px;background:#fff;color:#9a6800;border-radius:99px;padding:5px 14px;font-weight:900}
/* QUESTION GAMES */
#gz{position:fixed;inset:0;display:none;overflow:auto;padding:12px 16px 30px;background:linear-gradient(160deg,#ffe3f1,#fff3bf 45%,#cdeeff)}
.gzTitle{font-weight:900;font-size:clamp(17px,2.4vw,28px);color:#173b60;text-align:center}
.gzBody{max-width:940px;margin:10px auto 0}
.qcQ{max-width:900px;margin:8px auto;text-align:center;font-size:clamp(19px,2.5vw,30px);font-weight:900;background:#fff;border-radius:20px;padding:10px 16px;box-shadow:0 6px 16px #173b6020;color:#173b60}
.qcInfo{max-width:900px;margin:6px auto;display:flex;justify-content:space-between;font-weight:900;font-size:20px;color:#4a35b0}
.qcFact{max-width:900px;margin:6px auto;min-height:40px;text-align:center;font-weight:800;color:#36556d;font-size:clamp(15px,1.8vw,19px)}
.help{text-align:center;font-weight:800;color:#4e687d;margin:6px}
.field{position:relative;max-width:900px;margin:0 auto;height:min(60vh,540px);border-radius:26px;overflow:hidden;border:5px solid #fff;box-shadow:0 8px 20px #173b6030;background:linear-gradient(#9fdcff 0%,#e3f6ff 62%,#7ed06a 62%)}
.bub{position:absolute;left:0;top:0;background:#fff;border:4px solid var(--bc);border-radius:22px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 8px 16px #0003;font-weight:900;text-align:center;color:#173b60;font-size:clamp(13px,1.5vw,18px);line-height:1.15;will-change:transform;transition:opacity .25s,box-shadow .2s}
.b0{--bc:#ff6b6b}.b1{--bc:#4dabf7}.b2{--bc:#51cf66}.b3{--bc:#fcc419}.bub .be{font-size:clamp(26px,3.4vw,40px)}
.bub.good{box-shadow:0 0 0 7px #51cf6699,0 8px 16px #0003}.bub.bad{opacity:.25;filter:grayscale(1)}
.bl{--bg:#ff5a5f;position:absolute;left:0;top:0;border:0;background:var(--bg);border-radius:50% 50% 48% 48%/58% 58% 42% 42%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#fff;font-weight:900;padding:8px 10px;cursor:pointer;text-shadow:0 2px 3px #0005;font-size:clamp(13px,1.5vw,17px);line-height:1.15;box-shadow:inset -10px -14px 24px #0003,inset 8px 10px 16px #fff5,0 8px 16px #0003;will-change:transform}
.bl:after{content:"";position:absolute;bottom:-12px;left:50%;margin-left:-8px;border:8px solid transparent;border-bottom-color:var(--bg);border-top:0}
.bl.c0{--bg:#ff5a5f}.bl.c1{--bg:#339af0}.bl.c2{--bg:#40c057}.bl.c3{--bg:#be4bdb}.bl .be{font-size:clamp(28px,3.6vw,44px)}

/* auto picture clue for the compact questions */
function autoSVG(q){
 const [bg,em]=q.scn,pos=[[150,170],[650,170],[140,450],[660,450],[400,110],[400,520]];
 let b=BG[bg]+`<text x="400" y="320" font-size="240" text-anchor="middle" dominant-baseline="central" class="bob">${em[0]}</text>`;
 em.slice(1).forEach((e,i)=>{const p=pos[i];b+=`<text x="${p[0]}" y="${p[1]}" font-size="105" text-anchor="middle" dominant-baseline="central" class="bob" style="animation-delay:${(i+1)*.5}s">${e}</text>`});
 b+=`<text x="740" y="60" font-size="46" class="bob" style="animation-delay:.3s">✨</text>`;
 return `<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Picture clue: ${em.join(' ')}" font-family="Segoe UI Emoji,Apple Color Emoji,Noto Color Emoji,sans-serif">${b}</svg>`;
}

QT.hi["Super Senses"]=["किस जानवर की सूँघने की तेज़ शक्ति पुलिस को चीज़ें ढूँढने में मदद करती है?|कुत्ता|गाय|तोता|मछली|सूँघने वाले मददगार के बारे में सोचो।|कुत्ते की सूँघने की शक्ति हमसे कहीं ज़्यादा तेज़ होती है।","कौन सी चिड़िया रात में अच्छा देख सकती है?|उल्लू|मुर्गी|कबूतर|गौरैया|इसकी बड़ी आँखें अँधेरे में मदद करती हैं।|उल्लू की बड़ी आँखें उसे रात में देखने में मदद करती हैं।","कौन सा जानवर रास्ता ढूँढने के लिए आवाज़ की गूँज का इस्तेमाल करता है?|चमगादड़|बाज़|खरगोश|ऊँट|यह रात में उड़ता है।|चमगादड़ ऊँची आवाज़ निकालते हैं और उसकी गूँज सुनते हैं।","साँप अपनी जीभ बार-बार बाहर निकालकर मुख्य रूप से क्या करता है?|हवा को सूँघता है|गाना गाता है|पूँछ साफ़ करता है|रंग बदलता है|जीभ सिर्फ़ चखने से ज़्यादा काम कर सकती है।|साँप अपनी जीभ से गंध पकड़ते हैं।"];
QT.hi["Seed Stories"]=["सिंहपर्णी (डैंडेलियन) के बीज पर मुलायम रोएँ होते हैं। वह कैसे सफ़र करता है?|हवा से|तैरकर|बिजली से|पैदल चलकर|हल्के बीज हवा में तैरते हैं।|रोएँदार बीज हवा के साथ दूर-दूर तक पहुँच जाते हैं।","कौन सा बीज पानी पर तैरकर जा सकता है?|नारियल|मक्का|सेम|सूरजमुखी|इसका मोटा खोल तैरता है।|नारियल समुद्र पर बहुत दूर तक तैर सकता है।","पानी, हवा और गर्मी मिलने पर बीज क्या करता है?|अंकुरित होता है|पिघल जाता है|चमकता है|उड़ जाता है|एक नन्हा अंकुर निकलता है।|अंकुरण वह है जब बीज पौधे के रूप में उगना शुरू करता है।","कच्चे आम से कौन सा पेय बनता है?|आम पन्ना|नारियल पानी|गन्ने का रस|छाछ|यह गर्मियों में खट्टा-मीठा और ठंडा होता है।|आम पन्ना कच्चे आम से बना गर्मियों का खट्टा-मीठा पेय है।"];
QT.hi["Water Wonders"]=["पानी का भाप में बदलना क्या कहलाता है?|वाष्पीकरण|जमना|पिघलना|खोदना|गीले कपड़े सूखने के बारे में सोचो।|सूरज की गर्मी पानी को भाप बना देती है।","ऊँचाई पर आसमान में जलवाष्प ठंडी होने पर क्या होता है?|बादल बनते हैं|रेत बन जाती है|वह गायब हो जाती है|मिट्टी बन जाती है|नन्ही बूँदें आपस में इकट्ठी हो जाती हैं।|बादल पानी की नन्ही बूँदों से बनते हैं।","कौन सी आदत पानी बचाने में मदद करती है?|टपकता नल ठीक कराना|नल खुला छोड़ना|पानी बर्बाद करना|सड़क पर पानी डालना|छोटे-छोटे रिसाव भी मिलकर बहुत पानी बर्बाद करते हैं।|टपकता नल रोज़ बहुत सारा पानी बर्बाद कर सकता है।","कौन सा पानी पीने के लिए बहुत खारा है?|समुद्र का पानी|नदी का पानी|बारिश का पानी|कुएँ का पानी|समुद्र के बारे में सोचो।|धरती का ज़्यादातर पानी खारा समुद्री पानी है।"];
QT.hi["Food & Digestion"]=["भोजन का पाचन कहाँ से शुरू होता है?|मुँह में|पैर में|नाक में|कान में|हम वहाँ खाना चबाते हैं।|चबाने से खाना छोटे टुकड़ों में टूट जाता है।","हमारे मुँह में कौन सी चीज़ खाने में मिलकर उसे तोड़ने में मदद करती है?|लार|खून|हवा|पसीना|इससे मुँह में पानी आ जाता है!|चबाते समय लार खाने को तोड़ना शुरू कर देती है।","कौन से खाने से हमें रेशा (फ़ाइबर) मिलता है जो पाचन में मदद करता है?|फल और सब्ज़ियाँ|मिठाइयाँ|कोल्ड ड्रिंक|चिप्स|रंग-बिरंगी थाली के बारे में सोचो।|रेशा खाने को शरीर में आसानी से आगे बढ़ाता है।","चबाया हुआ खाना किस नली से नीचे जाता है?|भोजन नली|श्वास नली|स्ट्रॉ|नाक|यह पेट तक जाती है।|भोजन नली खाने को मुँह से पेट तक पहुँचाती है।"];
QT.hi["Living World"]=["सभी जीवित चीज़ों के बारे में क्या सही है?|वे बढ़ती हैं और प्रतिक्रिया करती हैं|वे पत्थर बन जाती हैं|वे कभी नहीं बदलतीं|वे बिजली बनाती हैं|एक पिल्ले और एक पौधे के बारे में सोचो।|जीवित चीज़ें बढ़ती हैं, उन्हें ऊर्जा चाहिए और वे आसपास के हिसाब से प्रतिक्रिया करती हैं।","ऊँट के चौड़े पैर उसे कहाँ चलने में मदद करते हैं?|रेगिस्तान की रेत में|गहरे समुद्र में|बर्फ़ीले पहाड़ों पर|घने जंगल में|नरम, गहरी रेत के बारे में सोचो।|ऊँट गर्म, सूखे रेगिस्तान में रहने के लिए ढले हुए होते हैं।","पानी में उगने वाले पौधे, जैसे कमल, क्या कहलाते हैं?|जलीय पौधे|रेगिस्तानी पौधे|लताएँ|पेड़|तालाब को देखो।|जलीय पौधों के ख़ास अंग उन्हें पानी में रहने में मदद करते हैं।","जिस जगह कोई जीव रहता है, उसे उसका क्या कहते हैं?|आवास|शौक|होटल|सड़क|यह उसका प्राकृतिक घर है।|आवास जीवों को खाना, पानी और आसरा देता है।"];
QT.hi["Healthy Eating"]=["कौन सा पोषक तत्व हमारे शरीर को बनाता और उसकी मरम्मत करता है?|प्रोटीन|नमक|चीनी|प्लास्टिक|दाल, अंडे और पनीर में यह होता है।|प्रोटीन मांसपेशियों को बढ़ने और ठीक होने में मदद करता है।","नींबू और आँवला किसमें भरपूर होते हैं?|विटामिन सी|कैल्शियम|आयरन|रेशा|ये खट्टे होते हैं।|विटामिन सी शरीर को बीमारियों से लड़ने में मदद करता है।","संतुलित आहार का मतलब है खाना…|तरह-तरह की चीज़ें|सिर्फ़ मिठाई|सिर्फ़ तली चीज़ें|सिर्फ़ एक फल|रंग-बिरंगी थाली के बारे में सोचो।|संतुलित आहार में सारे पोषक तत्व सही मात्रा में होते हैं।","कौन सा खनिज मज़बूत हड्डियाँ और दाँत बनाता है?|कैल्शियम|चीनी|तेल|चर्बी|दूध इसका अच्छा स्रोत है।|दूध, दही और रागी में कैल्शियम होता है।"];
QT.hi["Magnets & Motion"]=["इनमें से किसे चुंबक अपनी ओर खींचेगा?|लोहे की कील|लकड़ी का चम्मच|काँच की गोली|रबर बैंड|धातुओं के बारे में सोचो।|चुंबक लोहे जैसे चुंबकीय पदार्थों को खींचता है।","चुंबक के दोनों सिरे क्या कहलाते हैं?|ध्रुव|कोने|ज़ंजीरें|धागे|ये सबसे ताकतवर भाग होते हैं।|हर चुंबक का एक उत्तरी ध्रुव और एक दक्षिणी ध्रुव होता है।","पेंसिल की लंबाई नापने के लिए कौन सी इकाई सबसे अच्छी है?|सेंटीमीटर|किलोग्राम|लीटर|सेकंड|स्केल को देखो।|लंबाई सेंटीमीटर, मीटर और किलोमीटर में नापी जाती है।","झूले पर बच्चा आगे-पीछे जाता है। यह है…|आवर्ती गति|सीधी रेखा में गति|वृत्ताकार गति|कोई गति नहीं|यह बार-बार दोहराई जाती है।|जो गति बराबर समय के बाद दोहराई जाए उसे आवर्ती गति कहते हैं।"];
QT.hi["Water & Materials"]=["पानी बर्फ़, द्रव या ___ रूप में हो सकता है।|जलवाष्प|रेत|धुआँ|धूल|भाप के बारे में सोचो।|पानी ठोस, द्रव और गैस के रूप में मिलता है।","रेत को पानी से अलग कैसे कर सकते हैं?|छानकर (निस्यंदन)|चुंबक से|फटककर|हाथ से चुनकर|कपड़े से छानकर देखो।|छानने से ठोस कण द्रव से अलग हो जाते हैं।","कौन सी सामग्री पारदर्शी है?|साफ़ काँच|लकड़ी|धातु|गत्ता|आप इसके आर-पार देख सकते हैं।|पारदर्शी पदार्थों से रोशनी पूरी तरह गुज़र जाती है।","नमकीन पानी को गर्म करके पानी भाप बन जाए तो क्या बचता है?|नमक|चीनी|रेत|कुछ नहीं|सूखी परत को चखकर देखो।|नमक के खेतों में समुद्र का पानी भाप बनाकर नमक बनाया जाता है।"];

"Plant Power":["वनस्पतीचा कोणता भाग मातीतून पाणी शोषतो?|पान|मूळ|फूल|फळ|मातीखाली पाहा! लहान भाग स्ट्रॉसारखे काम करतात.|काही मुळे, जसे गाजर, वनस्पतीसाठी अन्न साठवतात.","वनस्पतींना सूर्यप्रकाश मुख्यत: कशासाठी हवा?|स्वतःचे अन्न बनवण्यासाठी|दगड बनवण्यासाठी|दूध पिण्यासाठी|माती बनवण्यासाठी|पाने अन्न बनवण्यासाठी सूर्यप्रकाश वापरतात.|सूर्यफूल सूर्याच्या दिशेने आपले तोंड फिरवते!","बी रुजण्यासाठी कोणत्या तीन गोष्टी मदत करतात?|पाणी, हवा आणि उब|चॉकलेट, बर्फ आणि मीठ|फक्त सूर्यप्रकाश|फक्त माती|लहान अंकुर येण्यापूर्वी बीला योग्य परिस्थिती हवी.|काही बिया वर्षानुवर्षे झोपून राहतात आणि पाऊस पडल्यावर जागे होतात.","कोणता भाग वनस्पतीला ताठ उभे ठेवतो आणि पाणी पानांपर्यंत पोहोचवतो?|खोड|पाकळी|बी|खडा|मुळे आणि फुलांच्या मधला लांब हिरवा भाग पाहा.|उंच झाडे पाणी अनेक मीटर वर चढवू शकतात!","बीमधून येणाऱ्या लहान नव्या रोपाला काय म्हणतात?|रोप (अंकुर)|खडा|अंडे|पिल्लू|ते लहान, हिरवे असते आणि नुकतेच वाढू लागले आहे.|घेवड्याचे रोप काही दिवसांतच वर येते."],
"Bee & Flower Lab":["परागकण नेऊन फुलांना बिया बनवण्यास कोणता कीटक मदत करतो?|मुंगी|मधमाशी|कोळी|फुलपाखरू|गुं-गुं! फुलांवर कोण येतो आणि त्याच्या अंगाला काय चिकटते ते पाहा.|एक मधमाशी एका फेरीत शेकडो फुलांवर जाऊ शकते.","मधमाश्या फुलांवर का जातात?|मकरंद किंवा परागकण शोधायला|माती खायला|पाने बनवायला|पाण्यात झोपायला|फुले मधमाश्यांसाठी खाण्याचे ठिकाण असू शकतात.|मधमाशीचे पंख एका सेकंदात सुमारे 200 वेळा फडफडतात!","कीटकाला फुलाकडे काय आकर्षित करू शकते?|रंग किंवा सुगंध|धातूचा चमचा|दगड|शाळेची बॅग|तेजस्वी रंग आणि गोड सुगंध फुलाकडे पाहुणे आणतात.|अनेक फुलांवर खास नक्षी असते जी मधमाश्यांना दिसते.","फुलांच्या आतला कोणता गोड रस मधमाश्या गोळा करतात?|मकरंद|साबण|वाळू|शाई|मधमाश्या त्याचे मधात रूपांतर करतात!|एक मधमाशी आयुष्यात फक्त एक छोटा चमचा मध बनवते.","फुलाचा कोणता भाग तेजस्वी रंगांनी कीटकांना आकर्षित करतो?|पाकळ्या|मुळे|साल|खडे|मधल्या भागाभोवतीचे रंगीत भाग पाहा.|काही फुले फक्त रात्री उमलतात, पतंगांसाठी."],

"Light & Shadows":["कोण स्वतःचा प्रकाश निर्माण करतो?|सूर्य|चंद्र|आरसा|दगड|चंद्र फक्त प्रकाश परावर्तित करतो.|सूर्य स्वतःचा प्रकाश निर्माण करतो. चंद्र तो फक्त परावर्तित करतो.","सावली केव्हा तयार होते?|प्रकाश अडवला जातो तेव्हा|आवाज मोठा असतो तेव्हा|पाऊस पडतो तेव्हा|थंडी असते तेव्हा|काहीतरी प्रकाशात उभे असते.|एखादी वस्तू प्रकाश अडवते तेव्हा सावली तयार होते.","तुमची सावली सर्वात लहान केव्हा असते?|भर दुपारी|सूर्योदयाला|सूर्यास्ताला|रात्री|सूर्य अगदी डोक्यावर असतो.|दुपारी सूर्य सर्वात उंच असतो, म्हणून सावल्या सर्वात लहान असतात.","कोणत्या पदार्थातून प्रकाश सहज जातो?|स्वच्छ काच|वीट|पुस्तक|लाकूड|तुम्ही त्याच्या आरपार पाहू शकता.|स्वच्छ काच पारदर्शक असतो. प्रकाश त्यातून जातो."],

"Rocks & Soil":["कोणती माती सर्वात जास्त पाणी धरून ठेवते?|चिकणमाती|वाळू|खडी|मीठ|ओली झाल्यावर ती चिकट होते.|चिकणमातीचे कण खूप लहान असतात आणि ती पाणी चांगले धरून ठेवते.","वनस्पतींना खनिजे कुठून मिळतात?|माती|प्लास्टिक|धातू|काच|मुळे त्यात जातात.|मुळे मातीतून पाणी आणि खनिजे घेतात.","मोठ्या इमारती बहुतेक कशापासून बनतात?|दगड, वीट आणि सिमेंट|बर्फ|साखर|ढग|मजबूत गोष्टींचा विचार करा.|दगड, वीट आणि सिमेंटपासून मजबूत इमारती बनतात.","गांडुळे शेतकऱ्यांचे मित्र का आहेत?|ती माती भुसभुशीत करतात|ती पिके खातात|ती दगड बनवतात|ती पाऊस पाडतात|ती बोगदे खणतात.|गांडुळे माती मिसळून भुसभुशीत करतात, त्यामुळे झाडे चांगली वाढतात."],

 if(locked)return;const q=curQ(),x=QX(q),bs=[...document.querySelectorAll('.ans')];

 if(RUN.kind==='adv'){const nb=!SAVE.badges.includes(RUN.adv);SAVE.best[RUN.adv]=Math.max(SAVE.best[RUN.adv]||0,st);if(nb){SAVE.badges.push(RUN.adv);extra='<p>'+t('newBadge')+'</p>'}title='🏆 '+advBadge(RUN.adv)+'!'}
 else if(RUN.kind==='daily'){title='📅 '+t('dailyQ')+'!';if(SAVE.daily!==today()){SAVE.daily=today();addXp(50);extra='<p>'+t('dailyBonus')+'</p>'}else extra='<p>'+t('comeBack')+'</p>'}else title='⚡ '+t('mixQ')+'!';

let bkId=0;
const SKINS=[['#ff5a5f','#ffc2c4'],['#1599e9','#a5e3ff'],['#31ad62','#b9f3cc'],['#7049df','#d3c8ff'],['#f2a11f','#ffe39a']];
function bucketSVG(i){const [a,b]=SKINS[i%SKINS.length],id='bk'+(bkId++);
 return `<svg viewBox="0 0 150 130" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${b}"/><stop offset="1" stop-color="${a}"/></linearGradient></defs><path d="M32 42 Q75 -20 118 42" fill="none" stroke="#8a5a2b" stroke-width="8" stroke-linecap="round"/><path d="M14 46 H136 L118 118 Q116 126 106 126 H44 Q34 126 32 118Z" fill="url(#${id})" stroke="#fff" stroke-width="4"/><path d="M44 58 L52 120 M75 58 V124 M106 58 L98 120" stroke="#fff" stroke-opacity=".35" stroke-width="6" stroke-linecap="round"/><ellipse cx="75" cy="46" rx="61" ry="13" fill="${b}" stroke="#fff" stroke-width="4"/><ellipse cx="75" cy="48" rx="52" ry="8" fill="#3b2418" opacity=".5"/><g><circle cx="55" cy="86" r="9" fill="#fff"/><circle cx="95" cy="86" r="9" fill="#fff"/><circle cx="57" cy="88" r="4.5" fill="#2b1b12"/><circle cx="97" cy="88" r="4.5" fill="#2b1b12"/><path d="M62 100 Q75 116 88 100Z" fill="#7b2a2a"/><circle cx="42" cy="100" r="5" fill="#ff7b9c" opacity=".6"/><circle cx="108" cy="100" r="5" fill="#ff7b9c" opacity=".6"/></g></svg>`}
function Bucket(field,el,skin){
 const o={x:0,tx:0,w:110};el.innerHTML=bucketSVG(skin);
 o.size=()=>{const W=field.clientWidth;o.w=Math.max(96,Math.min(170,W*.2));el.style.width=o.w+'px';return W};
 o.reset=()=>{const W=o.size();o.x=o.tx=W/2;o.update(.016)};
 o.move=cx=>{const r=field.getBoundingClientRect();o.tx=Math.max(o.w/2,Math.min(r.width-o.w/2,cx-r.left))};
 o.update=dt=>{const W=field.clientWidth;o.tx=Math.max(o.w/2,Math.min(W-o.w/2,o.tx));o.x+=(o.tx-o.x)*(1-Math.exp(-16*dt));el.style.transform=`translate3d(${o.x-o.w/2}px,0,0)`};
 o.squish=()=>{el.classList.remove('sq');void el.offsetWidth;el.classList.add('sq')};
 field.addEventListener('pointermove',e=>o.move(e.clientX));field.addEventListener('pointerdown',e=>o.move(e.clientX));return o}
function burst(field,x,y,emo){for(let i=0;i<6;i++){const s=document.createElement('span');s.className='bs';s.textContent=emo||'✨';s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--dx',(Math.random()*120-60)+'px');s.style.setProperty('--dy',(-30-Math.random()*70)+'px');field.appendChild(s);setTimeout(()=>s.remove(),700)}}
function floatTxt(field,x,y,txt,cls){const s=document.createElement('div');s.className='ft '+(cls||'');s.textContent=txt;s.style.left=x+'px';s.style.top=y+'px';field.appendChild(s);setTimeout(()=>s.remove(),900)}
const HEALTHY=['🍎','🍌','🍇','🍉','🍊','🍓','🍍','🥕','🥦','🍅','🌽','🥭','🍐','🥒'],TREATS=['🍕','🍩','🍔','🍦','🧁','🍪','🌭','🍟'];
const FC_TOTAL=300;
const FC={state:'idle',el:0,score:0,caught:0,streak:0,items:[],spawn:0,last:0,raf:0,step:0,bk:null,cd:0};
const fcSpeedF=s=>.165*Math.pow(1.3,Math.min(s,6));
function fcRefreshStart(){if($('hPause'))$('hPause').textContent=t('fcPause');if($('cResume'))$('cResume').textContent=t('fcResume');if($('hSkin'))$('hSkin').textContent='🎨';if($('fcHintTx'))$('fcHintTx').textContent=t(matchMedia('(hover:none)').matches?'fcHintT':'fcHint')}
function fcSkin(i){SAVE.skin=((i%SKINS.length)+SKINS.length)%SKINS.length;persist();if(FC.bk)$('cBk').innerHTML=bucketSVG(SAVE.skin)}
function fcNextSkin(){fcSkin(SAVE.skin+1)}
function fcShow(s){$('cGame').style.display=s==='end'?'none':'block';$('cEnd').style.display=s==='end'?'flex':'none';$('cPaused').style.display=s==='pause'?'flex':'none';$('cHint').style.display=s==='ready'?'flex':'none';$('cBk').classList.toggle('wig',s==='ready');$('cWrap').classList.toggle('rdy',s==='ready')}
function fcReady(){
 cancelAnimationFrame(FC.raf);clearTimeout(FC.cd);FC.items.forEach(i=>i.el.remove());Object.assign(FC,{items:[],el:0,score:0,caught:0,streak:0,spawn:.2,step:0,state:'ready'});
 const f=$('cField');if(!FC.bk)FC.bk=Bucket(f,$('cBk'),SAVE.skin);else $('cBk').innerHTML=bucketSVG(SAVE.skin);FC.bk.reset();

function fcWire(){const f=$('cField');f.addEventListener('pointerenter',fcEnter);f.addEventListener('pointerdown',fcEnter);f.addEventListener('touchstart',fcEnter,{passive:true})}
function fcHud(){$('hScore').textContent='⭐ '+FC.score;const left=Math.max(0,Math.ceil(FC_TOTAL-FC.el));$('hTime').textContent='⏱ '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');$('hSpeed').textContent='⚡ '+(FC.step+1)+'/10'}
function fcSpawn(W,H){
 const r=FC.state==='ready'?.3:Math.random();let type,emo,pts;
 if(r<.08){type='gold';emo='⭐';pts=10}else if(r<.62){type='good';emo=HEALTHY[Math.floor(Math.random()*HEALTHY.length)];pts=3}else{type='treat';emo=TREATS[Math.floor(Math.random()*TREATS.length)];pts=1}
 const size=Math.max(56,Math.min(90,W*.108)),el=document.createElement('div');el.className='it '+type;el.textContent=emo;el.style.fontSize=size+'px';$('cField').appendChild(el);
 FC.items.push({el,x:size/2+Math.random()*(W-size),y:-size,v:H*fcSpeedF(FC.step)*(.9+Math.random()*.2)*(FC.state==='ready'?.8:1),size,pts,type,rot:(Math.random()-.5)*50,sp:(Math.random()-.5)*40})}
function fcLoop(now){
 const rdy=FC.state==='ready';if(FC.state!=='play'&&!rdy)return;if(rdy&&document.body.dataset.screen!=='home'){FC.cd=setTimeout(()=>{FC.last=performance.now();FC.raf=requestAnimationFrame(fcLoop)},400);return}const f=$('cField'),W=f.clientWidth,H=f.clientHeight,ts=window.__ts||1;
 const real=Math.min(.05,(now-FC.last)/1000),dt=real*ts;FC.last=now;if(!rdy)FC.el+=dt;
 const step=rdy?0:Math.min(9,Math.floor(FC.el/30));if(step!==FC.step){FC.step=step;if(step>0){fcBanner(t('fcUp')+' '+(step+1));tone(660,.12,'sawtooth',.04);tone(990,.15,'sawtooth',.04,.1)}}
 FC.spawn-=dt;if(FC.spawn<=0){fcSpawn(W,H);FC.spawn=rdy?1.1:Math.max(.6,1.2-.06*FC.step)}
 const bk=FC.bk;bk.size();bk.update(real);const bh=bk.w*.87,openY=H-bh-6+bh*.3;
 for(let i=FC.items.length-1;i>=0;i--){const it=FC.items[i];it.y+=it.v*dt;it.rot+=it.sp*dt;it.el.style.transform=`translate3d(${it.x-it.size/2}px,${it.y}px,0) rotate(${it.rot}deg)`;
  if(it.y+it.size*.75>=openY&&it.y<openY+it.size*.5&&Math.abs(it.x-bk.x)<bk.w*.5){
   if(rdy){burst(f,it.x,openY,it.emo);bk.squish();it.el.remove();FC.items.splice(i,1);continue}
   if(it.type==='treat'){FC.score=Math.max(0,FC.score-2);FC.streak=0;floatTxt(f,it.x,openY-10,'−2 🚫','treat');bk.squish();tone(200,.25,'square',.05);it.el.remove();FC.items.splice(i,1);continue}
   FC.score+=it.pts;FC.caught++;FC.streak++;let bonus='';if(FC.streak%10===0){FC.score+=5;bonus=' 🔥+5'}
   floatTxt(f,it.x,openY-10,'+'+it.pts+bonus,it.type);burst(f,it.x,openY,it.type==='gold'?'⭐':it.emo);bk.squish();tone(500+Math.min(FC.streak,20)*25,.1,'triangle',.05);if(it.type==='gold')tone(1200,.2,'sine',.05,.08);
   it.el.remove();FC.items.splice(i,1)}
  else if(it.y>H+20){if(it.type==='good')FC.streak=0;it.el.remove();FC.items.splice(i,1)}}
 fcHud();if(!rdy&&FC.el>=FC_TOTAL){fcEnd();return}FC.raf=requestAnimationFrame(fcLoop)}
function fcBanner(m){const b=$('cBanner');b.textContent=m;b.classList.remove('pp');void b.offsetWidth;b.classList.add('pp');b.style.display='block';setTimeout(()=>{if(b.textContent===m)b.style.display='none'},1300)}
function fcEnd(){
